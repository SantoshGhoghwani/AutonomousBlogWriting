[project]
name = "blogwriting"
version = "0.1.0"
description = "BlogWriting using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.23,<2.0.0"
]

[project.scripts]
kickoff = "blogwriting.main:kickoff"
run_crew = "blogwriting.main:kickoff"
plot = "blogwriting.main:plot"
run_with_trigger = "blogwriting.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "10183eb7-2b4c-4f14-ad72-7873e3635f4a"
